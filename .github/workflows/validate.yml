name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: A change to the plugin raises its version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$(git diff --name-only "origin/$BASE_REF...HEAD" -- plugins/prized)" ]; then exit 0; fi
          base=$(git show "origin/$BASE_REF:plugins/prized/.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          head=$(python3 -c 'import json; print(json.load(open("plugins/prized/.claude-plugin/plugin.json"))["version"])')
          if [ "$base" = "$head" ]; then
            echo "::error::plugins/prized changed but the version is still $head. Raise version in plugins/prized/.claude-plugin/plugin.json, plugins/prized/plugin.json and plugins/prized/.cursor-plugin/plugin.json, or installed copies won't update."
            exit 1
          fi

      - name: Plugin checks (file types, piped installers, keys, skill frontmatter, manifests)
        run: python3 -m unittest discover -s .github/scripts

      - name: Claude Code marketplace and plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.310 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.310 plugin validate --strict plugins/prized
